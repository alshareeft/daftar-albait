<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر البيت</title>
<meta name="theme-color" content="#1f5c4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر البيت">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — date header, calendar card, agenda; quick-entry dock pinned to the bottom; tabs as a segmented bar under the header */
:root{
  --bg:#f2f3ee; --surface:#fdfdfb; --sunken:#e9ebe4; --ink:#1c231f; --muted:#667068; --line:#dcdfd6;
  --accent:#1f5c4d; --accent-ink:#ffffff; --accent-soft:#dbe9e3; --danger:#b42318; --urgent:#c2410c;
  --cal-bg:#e2ebe6; --cal-line:#cfdcd5; --cal-cell:#f8fbf9;
  --f-display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --surface:#1b211d; --sunken:#232a25; --ink:#e7ebe5; --muted:#9aa49c; --line:#2d3530;
  --accent:#6dbb9f; --accent-ink:#0f1a15; --accent-soft:#22362f; --danger:#f2786d; --urgent:#fb923c;
  --cal-bg:#172b22; --cal-line:#264238; --cal-cell:#223a2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1b211d; --sunken:#232a25; --ink:#e7ebe5; --muted:#9aa49c; --line:#2d3530;
  --accent:#6dbb9f; --accent-ink:#0f1a15; --accent-soft:#22362f; --danger:#f2786d; --urgent:#fb923c;
  --cal-bg:#172b22; --cal-line:#264238; --cal-cell:#223a2f; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;overscroll-behavior-y:none} /* no pull-to-refresh: a pull down on home unfolds the calendar instead */
html{font-size:14.5px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 170px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.1;margin:0}
.dates{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.dates b{color:var(--ink);font-weight:600}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.themebtn{width:32px;height:32px;color:var(--ink)}
header.top{flex-wrap:nowrap}
header.top .dates{flex:1;min-width:0}
.sync.on span{display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:#22a06b}
.sync.local i{background:var(--urgent)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:12px;padding-block:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:var(--sunken);border-radius:10px;padding:9px 4px;font-size:.88rem;font-weight:500;position:relative;min-width:0}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:-8px;left:-3px;box-shadow:0 0 0 2px var(--bg);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--urgent);color:#fff;font-size:.72rem;line-height:20px;font-variant-numeric:tabular-nums}

section.view{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* home day list: a notch smaller and tighter */
#dayList .grp-h{font-size:.9rem;padding-block:8px}
#dayList .grp-h .gcount{font-size:.75rem;line-height:20px}
#dayList .item{padding-block:8px}
#dayList .item .t{font-size:.9rem}
#dayList .meta{font-size:.72rem}
#dayList .chk{width:23px;height:23px;border-radius:7px;font-size:.8rem}
/* calendar = navigation: tinted green panel with light tiles; day list = content: plain neutral card */
.calcard{background:var(--cal-bg);border-color:var(--cal-line)}
.calcard .day{background:var(--cal-cell)}
.calcard .iconbtn,.calcard .ghost{background:var(--cal-cell);border-color:var(--cal-line)}
h2{font-size:1.05rem;margin:0;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.15rem}
/* keep the home page scrollable after the calendar shrinks, and stop the browser re-anchoring the scroll (it would undo the shrink) */
/* home is one screen: calendar + list header stay put, only the item list scrolls and stops at its last item */
body.is-home .wrap{padding-block-end:0}
#view-home{display:flex;flex-direction:column;min-height:0}
#view-home .calcard{flex:none}
.daycard{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:4px}
#dayList{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* calendar stays pinned under the tabs; only the day list moves */

.iconbtn svg{display:block}
/* day list grouped by category */
#dayList{display:flex;flex-direction:column;gap:6px}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 2px;text-align:right;font-weight:600}
.grp-h .sw{width:10px;height:10px;border-radius:3px;flex:none}
.grp-h .gname{flex:1;min-width:0}
.grp-h .gcount{font-size:.8rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;background:var(--sunken);border-radius:999px;padding:0 9px;line-height:22px}
.grp-h .chev{color:var(--muted);flex:none}
.closed .grp-h .chev{transform:rotate(90deg)}
.grp-top{display:flex;align-items:center;gap:6px}
.grp-top .grp-h{flex:1;min-width:0}
.iconbtn.sm{width:34px;height:34px;border-radius:9px;flex:none;color:var(--muted)}
/* full-screen in-store list */
.focus{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
.focus-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.focus-h .sw{width:12px;height:12px;border-radius:3px}
.focus-h h2{font-size:1.3rem}
.focus-h .gcount{font-size:.85rem;color:var(--muted);background:var(--sunken);border-radius:999px;padding:0 10px;line-height:24px}
.focus-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;max-width:760px;width:100%;margin:0 auto}
.focus-list .item{padding-block:14px}
.focus-list .t{font-size:1.25rem}
.focus-list .chk{width:32px;height:32px;border-radius:9px;font-size:1.1rem}
body.is-focus{overflow:hidden}
.card > .grp-h{padding-block:2px;font-size:1.05rem}
.grp .list{padding-inline-start:18px}
.grp .list .item:first-child{border-top:1px solid var(--line)}
/* shopping trip chip */
.trip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.88rem;text-align:right}
.trip span:first-of-type{flex:1;min-width:0}
.trip.late{border-color:var(--urgent);color:var(--urgent)}
#f-pin{grid-column:1/-1}
.pinlbl{display:flex;align-items:center;gap:8px;font-size:.92rem!important;color:var(--ink)!important}
.pinlbl input{width:20px;height:20px;accent-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.1rem}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-size:.85rem}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.day{border:0;background:var(--sunken);border-radius:10px;aspect-ratio:5/4;max-width:100%;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.2;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:0}
.day.out{opacity:.35}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;flex-wrap:nowrap;overflow:hidden;justify-content:center;gap:2px;max-width:100%;min-height:7px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.proj{opacity:.45}
.more{font-size:.6rem;line-height:7px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* items */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--c,var(--muted));background:transparent;display:grid;place-items:center;color:#fff;font-size:.9rem;padding:0}
.chk.on{background:var(--c,var(--muted))}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;text-align:right;padding:0}
.item .t{overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.76rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:.74rem;border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:6px;height:6px}
.pill.urgent{border-color:var(--urgent);color:var(--urgent);font-weight:600}
.group-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.group-h .sw{width:10px;height:10px;border-radius:3px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.cats-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cq{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.cq .dot{width:8px;height:8px}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding-top:6px}

/* dock */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.dock-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.entry{display:flex;gap:8px;align-items:flex-end}
.entry textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;max-height:120px;font-size:16px}
.addbtn{flex:none;height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.addbtn:disabled{opacity:.45}
.hint{font-size:.76rem;color:var(--muted)}
.preview{display:flex;flex-wrap:wrap;gap:6px}
.pv{border:1px solid var(--c);border-radius:10px;padding:4px 8px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:.82rem;max-width:100%}
.pv .dot{background:var(--c)}
.sg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.sg .dot{width:8px;height:8px;background:var(--c)}
.toast{display:flex;align-items:center;justify-content:center;gap:14px}
.toast .undo{border:0;background:transparent;color:var(--accent-soft);font-weight:700;text-decoration:underline;padding:2px 4px}
.pv b{font-weight:600;overflow-wrap:anywhere}
.pv select{border:0;background:transparent;font-size:.78rem;color:var(--muted);max-width:9em}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0;width:100%;font-size:16px}
.gridclip{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--sunken);color:var(--ink)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;margin:0 auto;max-width:420px;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem;text-align:center}

/* categories editor */
.catrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px}
.catrow .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.catrow input[type=text],.catrow select,.catrow textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.catrow textarea{font-size:.82rem;min-height:56px}
@media (prefers-reduced-motion: no-preference){.day,.chk,nav.tabs button{transition:background .15s, box-shadow .15s}}
@media (max-width:420px){nav.tabs button{font-size:.8rem}.brand{font-size:1.45rem}}
/* sign-in gate */
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h1{margin:0;font-size:1.6rem}
.gate p{margin:0;color:var(--muted)}
.gate .btn{padding:12px 16px;font-size:1rem}
/* mic */
.micbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.micbtn.on{background:var(--urgent);border-color:var(--urgent);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){.micbtn.on{animation:none}}
.talk{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.talk button{width:150px;height:150px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.1rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sync.off i{background:var(--urgent)}
.backup{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="dates" id="dates"></div>
    <div class="row" style="gap:10px;flex-wrap:nowrap"><div class="sync" id="sync"><i></i><span>جارِ الاتصال…</span></div>
    <button class="iconbtn sm themebtn" id="themeBtn" aria-label="تبديل الوضع الداكن والفاتح"></button></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">الرئيسية<span class="badge" id="badge-home" hidden>0</span></button>
    <button role="tab" data-tab="shop" aria-selected="false">المشتريات<span class="badge" id="badge-shop" hidden>0</span></button>
    <button role="tab" data-tab="tasks" aria-selected="false">المهام<span class="badge" id="badge-tasks" hidden>0</span></button>
    <button role="tab" data-tab="inbox" aria-selected="false">الوارد<span class="badge" id="badge-inbox" hidden>0</span></button>
    <button role="tab" data-tab="cats" aria-selected="false">التصنيفات</button>
  </nav>

  <section class="view" id="view-home">
    <div class="card calcard">
      <div class="cal-head">
        <button class="iconbtn" id="prevM" aria-label="الشهر السابق"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h2 id="monthTitle"></h2>
        <button class="ghost" id="todayBtn">اليوم</button>
        <button class="iconbtn" id="nextM" aria-label="الشهر التالي"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="grid7" id="dow"></div>
      <div class="gridclip" id="gridClip"><div class="grid7" id="calGrid"></div>
      <div class="legend" id="legend"></div></div>
    </div>
    <div class="card daycard">
      <div class="list" id="dayList"></div>
    </div>
  </section>

  <section class="view" id="view-tasks" hidden></section>
  <section class="view" id="view-shop" hidden></section>
  <section class="view" id="view-inbox" hidden></section>
  <section class="view" id="view-cats" hidden></section>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="preview" id="preview"></div>
    <div class="entry">
      <textarea id="entry" rows="1" placeholder="اكتب أو اضغط المايك…"></textarea>
      <button class="micbtn" id="micBtn" aria-label="إدخال صوتي" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="addbtn" id="addBtn" disabled>أضف</button>
    </div>
  </div>
</div>

<div id="focusHost" class="focus" hidden></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate"><div class="box">
  <h1>دفتر البيت</h1>
  <p id="gateMsg">جارِ التحميل…</p>
  <button class="btn" id="gateBtn" hidden></button>
  <button class="btn sec" id="gateOut" hidden>تسجيل الخروج</button>
</div></div>
<div class="talk" id="talk" hidden><button id="talkBtn"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>اضغط وتكلّم</button></div>
<script src="config.js"></script>
</body>
</html>

<script>
/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

/* ===================== Arabic parser (pure) ===================== */
//#PARSER-START
const AR_DIGITS = { "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9" };
function clean(s) { return String(s).replace(/[ً-ْـ]/g, "").replace(/[٠-٩]/g, d => AR_DIGITS[d]).replace(/\s+/g, " ").trim(); }
function norm(s) { return clean(s).replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase(); }
// pattern written in normalized form -> tolerant regex for original text
function fx(p) { return p.replace(/ا/g, "[اأإآ]").replace(/ه/g, "[هة]").replace(/ي/g, "[يى]"); }
const NUMW = { "واحد":1,"يومين":2,"اثنين":2,"ثلاث":3,"ثلاثه":3,"اربع":4,"اربعه":4,"خمس":5,"خمسه":5,"ست":6,"سته":6,"سبع":7,"سبعه":7,"ثمان":8,"ثمانيه":8,"تسع":9,"تسعه":9,"عشر":10,"عشره":10 };
const WEEKDAYS = ["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعه","السبت"];
const SHOP_VERBS = ["اشتري","اشتر","اشترِ","جيب","جيبوا","هات","نحتاج","محتاجين","ناقص","ناقصنا","خلص","خلصت","شراء","نشتري"];
const TASK_VERBS = ["نظف","تنظيف","رتب","ترتيب","اغسل","غسيل","غسل","اكوي","كوي","غير","تغيير","صلح","تصليح","اصلاح","اتصل","كلم","ادفع","دفع","سدد","سداد","فاتوره","موعد","احجز","حجز","راجع","مراجعه","جدد","تجديد","ودي","وصل","وصلي","ركب","تركيب","افحص","فحص","اسقي","سقي","ازرع","تذكير","ذكرني","اطبخ","جهز","تجهيز","شيل","نزل","ارسل","استلم"];

function tokenVariants(t) {
  const v = new Set([t]);
  for (const p of ["وال","بال","لل","فال","ال","و","ب","ل"]) if (t.startsWith(p) && t.length - p.length >= 2) v.add(t.slice(p.length));
  return [...v];
}
function kwHit(tokens, kw) {
  const k = norm(kw); if (!k) return false;
  if (k.includes(" ")) return tokens.join(" ").includes(k);
  return tokens.some(t => tokenVariants(t).some(v => v === k || (k.length >= 3 && v.startsWith(k) && v.length - k.length <= 2)));
}
function scoreCats(text, cats) {
  const tokens = norm(text).split(" ").filter(Boolean);
  let best = null, bestScore = 0;
  for (const c of cats) {
    let s = 0; for (const kw of c.kw || []) if (kwHit(tokens, kw)) s++;
    if (s > bestScore) { best = c; bestScore = s; }
  }
  return { cat: best, score: bestScore, tokens };
}

function parseWhen(text, now) {
  let t = clean(text); const n = norm(t); let date = null; let recur = null; let priority = "normal";
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const strip = re => { t = t.replace(new RegExp(re, "g"), " "); };
  // priority
  if (/(عاجل|مستعجل|ضروري|بسرعه|مهم جدا)/.test(n)) { priority = "urgent"; strip(fx("(عاجل|مستعجل|ضروري|بسرعه|مهم جدا)")); }
  // recurrence
  let m = n.match(/كل\s+(\d+|[^\s]+)?\s*(يوم|ايام|اسبوع|اسابيع|اسبوعين|شهر|شهور|اشهر|شهرين|سنه|سنين|سنوات)/);
  if (m) {
    let num = m[1] && /^\d+$/.test(m[1]) ? +m[1] : (m[1] && NUMW[m[1]]) || 1;
    let unit = m[2];
    if (unit === "اسبوعين" || unit === "شهرين") num = 2;
    unit = /يوم|ايام/.test(unit) ? "day" : /اسبوع|اسابيع/.test(unit) ? "week" : /شهر|شهور|اشهر/.test(unit) ? "month" : "year";
    if (m[1] && !/^\d+$/.test(m[1]) && !NUMW[m[1]]) num = 1;
    recur = { n: num, unit };
    strip(fx("كل\\s+(\\d+|[^\\s]+)?\\s*(يوم|ايام|اسبوع|اسابيع|اسبوعين|شهر|شهور|اشهر|شهرين|سنه|سنين|سنوات)"));
  }
  const nn = norm(t);
  // relative days
  if (/بعد\s+بكر[هه]/.test(nn)) { date = addDays(base, 2); strip(fx("بعد\\s+بكره")); }
  else if (/(بكره|بكرا|غدا|باكر)/.test(nn)) { date = addDays(base, 1); strip(fx("(بكره|بكرا|غدا|غدًا|باكر)")); }
  else if (/(اليوم|الحين|الليله)/.test(nn)) { date = base; strip(fx("(اليوم|الحين|الليله)")); }
  if (!date) {
    const r = nn.match(/بعد\s+(\d+|[^\s]+)\s*(يوم|ايام|يومين|اسبوع|اسابيع|اسبوعين|شهر|شهرين)/);
    if (r) {
      let k = /^\d+$/.test(r[1]) ? +r[1] : NUMW[r[1]] || 1; const u = r[2];
      if (r[1] === "يومين" || u === "يومين" || u === "اسبوعين" || u === "شهرين") k = /^\d+$/.test(r[1]) ? k : 2;
      date = /اسبوع|اسابيع/.test(u) ? addDays(base, 7 * k) : /شهر/.test(u) ? addMonths(base, k) : addDays(base, k);
      strip(fx("بعد\\s+(\\d+|[^\\s]+)\\s*(يوم|ايام|يومين|اسبوع|اسابيع|اسبوعين|شهر|شهرين)"));
    } else if (/(الاسبوع|الاسبوع)\s+(الجاي|القادم|الياي)/.test(nn)) { date = addDays(base, 7); strip(fx("الاسبوع\\s+(الجاي|القادم|الياي)")); }
    else if (/(الشهر)\s+(الجاي|القادم|الياي)/.test(nn)) { date = addMonths(base, 1); strip(fx("الشهر\\s+(الجاي|القادم|الياي)")); }
  }
  if (!date) {
    for (let i = 0; i < 7; i++) {
      const w = WEEKDAYS[i];
      if (new RegExp("(^|\\s)(يوم\\s+)?" + w + "($|\\s)").test(nn)) {
        let diff = (i - base.getDay() + 7) % 7; if (diff === 0) diff = 7;
        date = addDays(base, diff); strip(fx("(يوم\\s+)?" + w)); break;
      }
    }
  }
  if (!date) {
    const d = nn.match(/(?:يوم|بتاريخ)\s+(\d{1,2})(?:\s|$)/);
    if (d && +d[1] >= 1 && +d[1] <= 31) {
      let x = new Date(base.getFullYear(), base.getMonth(), +d[1]); if (x < base) x = new Date(base.getFullYear(), base.getMonth() + 1, +d[1]);
      date = x; strip(fx("(يوم|بتاريخ)\\s+" + d[1]));
    }
  }
  t = t.replace(/\s+/g, " ").trim();
  return { rest: t, date: date ? ymd(date) : null, recur, priority };
}

function stripVerbs(text, verbs) {
  let t = " " + text + " ";
  for (const v of verbs) t = t.replace(new RegExp("(^|\\s)" + fx(norm(v)) + "(?=\\s)", "g"), " ");
  return t.replace(/\s+/g, " ").replace(/^\s*(لي|لنا|من|و)\s+/, "").trim();
}

/* returns [{title, cat, date, recur, priority}] ; cat = category id or "inbox" */
function parseEntry(raw, cats, now = new Date()) {
  // one entry = one item: no splitting on commas, new lines or "و"
  const lines = [clean(raw).replace(/[\n]+/g, " ").trim()].filter(Boolean);
  const out = [];
  const taskCats = cats.filter(c => c.kind === "task"), shopCats = cats.filter(c => c.kind === "shop");
  for (const line of lines) {
    const w = parseWhen(line, now);
    const n = norm(w.rest), toks = n.split(" ");
    const shopSig = toks.some(t => SHOP_VERBS.map(norm).includes(t));
    const taskSig = !shopSig && toks.some(t => TASK_VERBS.map(norm).some(v => tokenVariants(t).includes(v)));
    let body = shopSig ? stripVerbs(w.rest, SHOP_VERBS) : w.rest;
    if (!body) continue;
    for (const p of [body]) {
      let cat = "inbox";
      if (taskSig || w.recur) {
        const r = scoreCats(p, taskCats); cat = (r.cat || taskCats[0] || {}).id || "inbox";
      } else {
        const rs = scoreCats(p, shopCats), rt = scoreCats(p, taskCats);
        if (rs.score > 0 && rs.score >= rt.score) cat = rs.cat.id;
        else if (rt.score > 0) cat = rt.cat.id;
      }
      out.push({ title: p, cat, date: w.date, recur: w.recur, priority: w.priority });
    }
  }
  return out;
}
//#PARSER-END

const INBOX = { id: "inbox", name: "الوارد", kind: "inbox", color: "#8a8f8b" };

/* ===================== state & store ===================== */
const state = { items: [], cats: DEFAULT_CATS, tab: "home", month: new Date(), sel: todayStr(), mode: "loading", readOnly: false, calCollapsed: false };
const catById = id => id === "inbox" ? INBOX : (state.cats.find(c => c.id === id) || INBOX);
const kindOf = it => catById(it.cat).kind;
state.trips = {};   // shopping trip date per shop category: {catId: "yyyy-mm-dd"}
state.closedShop = (() => { try { return new Set(JSON.parse(localStorage.getItem("daftar-closed-shop") || "[]")); } catch (e) { return new Set(); } })();
state.closedGroups = (() => { try { return new Set(JSON.parse(localStorage.getItem("daftar-closed-groups") || "[]")); } catch (e) { return new Set(); } })();

/* Effective date. Shop items follow their category's trip date unless pinned to their own date. */
function effDate(it) {
  if (kindOf(it) !== "shop") return it.date || null;
  if (it.done && it.doneAt) return ymd(new Date(it.doneAt));   // a bought item stays on the day it was bought, as a record
  const d = it.pin ? it.date : (state.trips[it.cat] || it.date);
  // once a shopping day has passed, what's left un-bought loses its date and waits to be rescheduled
  return d && (it.done || d >= todayStr()) ? d : null;
}
/* a store's date, only while it is today or later */
const liveTrip = cid => { const t = state.trips[cid]; return t && t >= todayStr() ? t : null; };
/* the category's current trip, if it still has open items following it */
function tripFor(catId, exceptId) {
  const t = state.trips[catId];
  const active = state.items.some(x => x.cat === catId && x.id !== exceptId && !x.done && !x.pin);
  return t && active ? t : null;
}
/* a store date is stale once it has passed, or once nothing is left following it (all bought, deleted or moved):
   drop it so the next item added there starts undated. An item that already follows this date keeps it (e.g. a rename). */
async function dropStaleTrip(catId, exceptId) {
  const t = state.trips[catId]; if (!t) return;
  const prev = exceptId && state.items.find(x => x.id === exceptId);
  if (prev && prev.cat === catId && !prev.done && !prev.pin) return;
  if (t < todayStr() || !tripFor(catId, exceptId)) await store.setTrip(catId, null);
}
/* the date a new, un-dated item in this category would get (or null) */
function plannedTrip(catId) {
  const t = state.trips[catId];
  return t && t >= todayStr() ? t : null;
}


/* ===== purchase history: one small document, keyed by normalized name; feeds the entry suggestions ===== */
const HIST_DAYS = 365;
state.history = {};
async function recordBought(it) {
  const key = norm(it.title).replace(/[.\/]/g, " ").trim(); if (!key) return;
  const prev = state.history[key], entry = { t: it.title, c: it.cat, n: ((prev && prev.n) || 0) + 1, d: todayStr() };
  const cutoff = ymd(addDays(new Date(), -HIST_DAYS));
  const next = {}; for (const k in state.history) if ((state.history[k].d || "") >= cutoff) next[k] = state.history[k];
  next[key] = entry; const pruned = Object.keys(next).length !== Object.keys(state.history).length + (prev ? 0 : 1);
  state.history = next;
  if (!db) return;
  const ref = db.doc("history/recent");
  // merge only this entry (other devices may be writing theirs); rewrite the whole map only when pruning old ones
  (pruned ? ref.set({ items: next }) : ref.merge({ items: { [key]: entry } })).catch(() => {});
}
/* bought shop items stay (struck through) on their day, then are removed; history keeps the name */
async function sweepBought() {
  // keep a year of purchases on the calendar; older bought items are deleted (at most once a day per device)
  if (!db || !db.oldDone) return;
  const today = todayStr();
  try { if (localStorage.getItem("daftar-swept") === today) return; localStorage.setItem("daftar-swept", today); } catch (e) {}
  const cutoff = addDays(new Date(), -HIST_DAYS).getTime();
  try { for (const it of await db.oldDone(cutoff)) if (catById(it.cat).kind === "shop") store.remove(it.id); } catch (e) {}
}
function suggestions(text) {
  const q = norm(text); if (q.length < 2) return [];
  const open = new Set(state.items.filter(it => !it.done).map(it => norm(it.title)));
  return Object.entries(state.history)
    .filter(([k, h]) => k.includes(q) && k !== q && !open.has(k) && catById(h.c).kind === "shop")
    .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || (b[1].n - a[1].n))
    .slice(0, 4);
}

let db = null;
const store = {
  async add(it) {
    const id = uid(); const doc = { ...it, done: false, doneAt: null, createdAt: Date.now() };
    if (db) db.doc("items/" + id).set(doc).catch(fail);
    return id;
  },
  async update(id, patch) {
    if (db) db.doc("items/" + id).update(patch).catch(fail);
  },
  async remove(id) {
    if (db) db.doc("items/" + id).delete().catch(fail);
  },
  async setTrip(catId, date) {
    const next = { ...state.trips }; if (date) next[catId] = date; else delete next[catId];
    state.trips = next;
    if (db) db.doc("config/trips").set(next).catch(fail);
    render();
  },
  async saveCats(list) {
    state.cats = list;
    if (db) db.doc("config/categories").set({ list }).catch(fail);
    render();
  }
};
function fail(e) {
  if (e && e.code === "permission-denied") { state.readOnly = true; toast("ليس لديك صلاحية التعديل في هذا الدفتر"); render(); }
  else if (e && e.code === "resource-exhausted") toast("تجاوز الدفتر الحد المجاني اليومي. يعود العمل غداً تلقائياً");
  else toast("تعذّر الحفظ. تحقق من الاتصال وحاول مرة أخرى");
}
function setSync(mode) {
  state.mode = mode; const el = $("#sync");
  const off = mode === "db" && !navigator.onLine;
  el.className = "sync " + (off ? "off" : mode === "db" && !state.readOnly ? "on" : "");
  el.title = mode === "db" ? (state.readOnly ? "مشترك · قراءة فقط" : "مشترك مع العائلة") : "";
  el.querySelector("span").textContent = off ? "غير متصل · يُحفظ عند الاتصال" : mode === "db" ? (state.readOnly ? "مشترك · قراءة فقط" : "مشترك مع العائلة") : "جارِ الاتصال…";
}

/* ===================== recurrence ===================== */
function stepDate(s, r) {
  const d = parseYmd(s);
  return ymd(r.unit === "day" ? addDays(d, r.n) : r.unit === "week" ? addDays(d, 7 * r.n) : r.unit === "month" ? addMonths(d, r.n) : addMonths(d, 12 * r.n));
}
const recurLabel = r => !r ? "" : r.unit === "day" ? (r.n === 1 ? "يومياً" : `كل ${r.n} أيام`) : r.unit === "week" ? (r.n === 1 ? "أسبوعياً" : r.n === 2 ? "كل أسبوعين" : `كل ${r.n} أسابيع`) : r.unit === "month" ? (r.n === 1 ? "شهرياً" : r.n === 2 ? "كل شهرين" : `كل ${r.n} أشهر`) : (r.n === 1 ? "سنوياً" : `كل ${r.n} سنوات`);

/* occurrences per day for [from,to] */
function occurrences(from, to) {
  const map = {};
  const push = (k, it, proj) => (map[k] = map[k] || []).push({ it, proj });
  for (const it of state.items) {
    const ed = it.cat === "inbox" ? null : effDate(it);
    if (!ed) continue;
    if (ed >= from && ed <= to) push(ed, it, false);
    if (it.recur && !it.done && kindOf(it) === "task") { let d = it.date, g = 0; while (g++ < 400) { d = stepDate(d, it.recur); if (d > to) break; if (d >= from) push(d, it, true); } }
  }
  return map;
}

/* ===================== rendering ===================== */
function itemRow(it, opts = {}) {
  const c = catById(it.cat); const done = !!it.done;
  const meta = [];
  if (opts.showCat) meta.push(`<span class="pill"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>`);
  if (it.priority === "urgent") meta.push(`<span class="pill urgent">عاجل</span>`);
  const ed = effDate(it);

/* swipe sideways to move to the neighbouring tab (RTL: finger to the right -> next tab on the left) */

    sx = null; if (e.touches.length !== 1) return;

    sx = t.clientX; sy = t.clientY; st = Date.now();

async function aiClassify(it) {
  if (!aiModel || !it || !it.id) return;
  const list = state.cats.map(c => `- ${c.id}: ${c.name} (${c.kind === "shop" ? "مشتريات" : "مهام"}) — أمثلة: ${(c.kw || []).slice(0, 15).join("، ")}`).join("\n");
  const prompt = `أنت تصنّف عنصراً أدخله فرد من أسرة سعودية في تطبيق للمهام والمشتريات المنزلية. قد يكون بالعامية أو فيه خطأ إملائي من الإملاء الصوتي.
التصنيفات المتاحة:
${list}

العنصر: «${it.title}»

أعد JSON فقط بهذا الشكل: {"cat": "معرّف التصنيف من القائمة، أو inbox إن لم تكن متأكداً", "title": "اسم العنصر مختصراً ومصححاً إملائياً، دون أفعال مثل اشتري أو جيب أو نحتاج"}`;
  try {
    const r = await aiModel.generateContent(prompt);
    let txt = r.response.text().trim().replace(/^```(json)?/i, "").replace(/```$/, "");
    const j = JSON.parse(txt), c = state.cats.find(x => x.id === j.cat);
    if (!c) { toast("لم يتعرّف عليه التصنيف، فبقي في الوارد"); return; }
    const title = typeof j.title === "string" && j.title.trim() && j.title.length <= 80 ? j.title.trim() : it.title;
    const patch = { cat: c.id, title, aiCat: true };
    if (c.kind === "shop") { patch.pin = false; patch.date = null; await dropStaleTrip(c.id, it.id); }
    store.update(it.id, patch);
    toast(`«${title}» ← ${c.name}`);
  } catch (e) { /* quota, network or App Check: the item simply stays in the inbox */ }
}

/* ===================== voice input (browser speech recognition) ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = "";
const micBtn = $("#micBtn");
micBtn.hidden = !SR;
if (!SR) $("#entry").placeholder = "اكتب…";
function setMic(on) { micBtn.classList.toggle("on", on); micBtn.setAttribute("aria-label", on ? "إيقاف الاستماع" : "إدخال صوتي"); }
function listen() {
  if (!SR || state.readOnly) return false;
  if (rec) { rec.stop(); return true; }
  heard = "";
  try {
    rec = new SR(); rec.lang = CFG.voiceLang || "ar-SA"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; entry.value = t; renderPreview(); sizeHome(); if (e.results[e.results.length - 1].isFinal) heard = t; };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { $("#talk").hidden = false; toast("اسمح للمتصفح باستخدام الميكروفون، أو استخدم مايك الكيبورد"); }
      else if (e.error !== "no-speech" && e.error !== "aborted") toast("تعذّر الاستماع. جرّب مايك الكيبورد");
    };
    rec.onend = () => { rec = null; setMic(false); if (heard.trim() && CFG.voiceAutoAdd !== false) submitEntry(); };
    rec.start(); setMic(true); return true;
  } catch (e) { rec = null; setMic(false); return false; }
}
micBtn.onclick = () => { $("#talk").hidden = true; listen(); };
$("#talkBtn").onclick = () => { $("#talk").hidden = true; listen(); };
$("#talk").addEventListener("click", e => { if (e.target.id === "talk") $("#talk").hidden = true; });
/* the home-screen shortcut opens …/#voice: start listening right away, or show one big button where the browser needs a tap first */
function startVoiceFromLink() {
  history.replaceState(null, "", location.pathname + location.search);
  state.tab = "home"; render();
  if (!SR) { entry.focus(); return; }
  if (!listen()) $("#talk").hidden = false;
}

/* ===================== backup / restore / account (categories tab) ===================== */
function backupCard() {
  return `<div class="card"><h2>الحساب والنسخ الاحتياطي</h2>
    <p class="small muted" style="margin:6px 0 0">${state.userEmail ? "مسجّل باسم " + esc(state.userEmail) : ""}</p>
    <div class="backup">
      <button class="btn sec" data-act="export">تنزيل نسخة احتياطية</button>
      <button class="btn sec" data-act="importPick" ${state.readOnly ? "disabled" : ""}>استيراد نسخة</button>
      <span class="spacer"></span>
      <button class="btn del" data-act="signout">تسجيل الخروج</button>
    </div>
    <div id="importConfirm" class="row" style="margin-top:10px" hidden></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>`;
}
let importData = null;
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "signout") window.daftarSignOut && window.daftarSignOut();
  if (act === "export" && db) {
    const data = { app: "daftar-albait", exportedAt: new Date().toISOString(), items: await db.all(), cats: state.cats, trips: state.trips, history: state.history };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = "daftar-albait-" + todayStr() + ".json"; document.body.appendChild(a); a.click(); a.remove();
  }
  if (act === "importPick") $("#importFile").click();
  if (act === "importGo" && importData && db) {
    $("#importConfirm").hidden = true;
    try { const n = await db.importAll(importData); toast("تم الاستيراد (" + n + " سجل)"); } catch (err) { toast("تعذّر الاستيراد: " + (err && err.code || "")); }
    importData = null;
  }
  if (act === "importCancel") { importData = null; $("#importConfirm").hidden = true; }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  try {
    importData = JSON.parse(await e.target.files[0].text());
    const n = (importData.items || []).length, box = $("#importConfirm");
    box.innerHTML = `<span style="flex:1">استيراد ${n} عنصر مع التصنيفات والتواريخ والسجل؟ العناصر بنفس المعرّف ستُستبدل.</span><button class="btn sec" data-act="importCancel">إلغاء</button><button class="btn" data-act="importGo">استيراد</button>`;
    box.hidden = false;
  } catch (err) { toast("الملف غير صالح"); }
  e.target.value = "";
});

</script>
