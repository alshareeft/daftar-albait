<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر البيت</title>
<meta name="theme-color" content="#f2f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر البيت">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — brand bar on top, page title, content cards; a bottom bar with four sections and the mic in the middle */
:root{
  --bg:#f4f3f1; --surface:#ffffff; --sunken:#efeeeb; --ink:#0a0a0a; --muted:#5e5e5e; --line:#e6e6e6; --rule:#f0f0f0; --control:#d4d4d4; --on-urgent:#ffffff;
  --accent:#1f5c4d; --accent-ink:#ffffff; --accent-soft:#e3eee9; --danger:#b42318; --urgent:#c2410c; --primary:#141414; --primary-ink:#ffffff;
  --cal-bg:var(--surface); --cal-line:var(--line); --cal-cell:var(--surface);
  --f-display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d0c; --surface:#151816; --sunken:#1f2320; --ink:#f1f3f1; --muted:#a3aaa5; --line:#222724; --rule:#222724; --control:#3a403c;
  --accent:#6dbb9f; --accent-ink:#0b0d0c; --accent-soft:#1c2a24; --danger:#f2786d; --urgent:#fb923c; --on-urgent:#1c1007; --primary:#f1f3f1; --primary-ink:#0b0d0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d0c; --surface:#151816; --sunken:#1f2320; --ink:#f1f3f1; --muted:#a3aaa5; --line:#222724; --rule:#222724; --control:#3a403c;
  --accent:#6dbb9f; --accent-ink:#0b0d0c; --accent-soft:#1c2a24; --danger:#f2786d; --urgent:#fb923c; --on-urgent:#1c1007; --primary:#f1f3f1; --primary-ink:#0b0d0c; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;overscroll-behavior-y:none} /* no pull-to-refresh: a pull down on home unfolds the calendar instead */
html{font-size:14.5px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a,button,input,select,textarea,label,summary{touch-action:manipulation}
select option{background-color:var(--surface);color:var(--ink)}
h1,h2,h3{text-wrap:balance}
/* press feedback (the default tap highlight is off): filled controls darken, plain ones dim */
button:not(:disabled):active{opacity:.6}
.btn:not(:disabled):active,.addbtn:not(:disabled):active,.iconbtn:not(:disabled):active,.micbtn:active,.ghost:not(:disabled):active,.cq:not(:disabled):active,.sg:active,.day:active,.chk:not(:disabled):active,nav.tabs button:active,.trip:not(:disabled):active,.talk button:active{opacity:1;filter:brightness(.88)}
@media (hover:hover){
  .btn:not(:disabled):hover,.addbtn:not(:disabled):hover,.iconbtn:not(:disabled):hover,.ghost:not(:disabled):hover,.cq:not(:disabled):hover,.sg:hover,.day:hover,nav.tabs button:hover,.trip:not(:disabled):hover,.micbtn:hover,.adddate:hover,.emogrid button:hover{filter:brightness(.95)}
  .item .txt:hover .t,.grp-h:hover .gname,.evhd:hover b{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:8px;z-index:80;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;transform:translateY(-200%)}
.skip:focus{transform:none}
/* keep a focused control clear of the pinned header and the entry bar */
html{scroll-padding-top:var(--mast-h,0px);scroll-padding-bottom:var(--dock-h,0px)}
.ferr{color:var(--danger);font-size:.8rem}
/* containers that receive focus only to move the reading position: no ring (their controls keep theirs) */
.sheet:focus,main:focus,#focusHost:focus{outline:none}
[aria-invalid="true"]{border-color:var(--danger)!important}
.discard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.1;margin:0}
.dates{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.dates b{color:var(--ink);font-weight:600}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.themebtn{width:32px;height:32px;color:var(--ink)}
header.top{flex-wrap:nowrap}
header.top .dates{flex:1;min-width:0}
.sync.on span{display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:#22a06b}
.sync.local i{background:var(--urgent)}

/* date row + tabs stay pinned at the top; the band above them (phone status bar) is painted so content never shows through */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin-top:-10px;padding-top:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.badge{position:absolute;top:-8px;left:-3px;box-shadow:0 0 0 2px var(--bg);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--urgent);color:var(--on-urgent);font-size:.72rem;line-height:20px;font-variant-numeric:tabular-nums}

section.view{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* home day list: a notch smaller and tighter */
#dayList .grp-h{font-size:.9rem;padding-block:8px}
#dayList .grp-h .gcount{font-size:.75rem;line-height:20px}
#dayList .item{padding-block:8px}
#dayList .item .t{font-size:.9rem}
#dayList .meta{font-size:.72rem}
#dayList .chk{width:23px;height:23px;border-radius:7px;font-size:.8rem}
/* calendar = navigation: tinted green panel with light tiles; day list = content: plain neutral card */
.calcard{background:var(--cal-bg);border-color:var(--cal-line)}
.calcard .day{background:var(--cal-cell)}
.calcard .iconbtn,.calcard .ghost{background:var(--cal-cell);border-color:var(--cal-line)}
h2{font-size:1.05rem;margin:0;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.15rem}
/* keep the home page scrollable after the calendar shrinks, and stop the browser re-anchoring the scroll (it would undo the shrink) */
/* home is one screen: calendar + list header stay put, only the item list scrolls and stops at its last item */
/* calendar stays pinned under the tabs; only the day list moves */

.iconbtn svg{display:block}
/* day list grouped by category */
#dayList{display:flex;flex-direction:column;gap:6px}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 2px;text-align:right;font-weight:600}
.grp-h .sw{width:10px;height:10px;border-radius:3px;flex:none}
.grp-h .gname{flex:1;min-width:0}
.grp-h[data-cat]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.grp-h.pressing{opacity:.55;transition:opacity .45s}
.grp-h .gcount{font-size:.8rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;background:var(--sunken);border-radius:999px;padding:0 9px;line-height:22px}
.grp-h .chev{color:var(--muted);flex:none}
.closed .grp-h .chev{transform:rotate(90deg)}
.grp-top{display:flex;align-items:center;gap:6px}
.grp-top .grp-h{flex:1;min-width:0}
.iconbtn.sm{width:34px;height:34px;border-radius:9px;flex:none;color:var(--muted)}
/* full-screen in-store list */
.focus{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
.focus-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.focus-h .sw{width:12px;height:12px;border-radius:3px}
.focus-h h2{font-size:1.3rem}
.focus-h .gcount{font-size:.85rem;color:var(--muted);background:var(--sunken);border-radius:999px;padding:0 10px;line-height:24px}
.focus-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;max-width:760px;width:100%;margin:0 auto}
.focus-list .item{padding-block:14px}
.focus-list .t{font-size:1.25rem}
.focus-list .chk{width:32px;height:32px;border-radius:9px;font-size:1.1rem}
body.is-focus{overflow:hidden}
.card > .grp-h{padding-block:2px;font-size:1.05rem}
.grp .list{padding-inline-start:18px}
.grp .list .item:first-child{border-top:1px solid var(--line)}
/* shopping trip chip */
.trip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.88rem;text-align:right}
.trip span:first-of-type{flex:1;min-width:0}
.trip.late{border-color:var(--urgent);color:var(--urgent)}
#f-pin{grid-column:1/-1}
.pinlbl{display:flex;align-items:center;gap:8px;font-size:.92rem!important;color:var(--ink)!important}
.pinlbl input{width:20px;height:20px;accent-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.1rem}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-size:.85rem}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.day{border:0;background:var(--sunken);border-radius:10px;aspect-ratio:5/4;max-width:100%;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.2;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:0}
.day.out:not(.sel){color:var(--muted);background:transparent!important}
.day.out .dots{opacity:.5}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;flex-wrap:nowrap;overflow:hidden;justify-content:center;gap:2px;max-width:100%;min-height:7px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.proj{opacity:.45}
.more{font-size:.6rem;line-height:7px}

/* items */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--c,var(--muted));background:transparent;display:grid;place-items:center;color:#fff;font-size:.9rem;padding:0}
.chk.on{background:var(--c,var(--muted))}
.chk{position:relative}
.chk::after{content:"";position:absolute;inset:-11px -12px}   /* ≈44px touch target; the visible box keeps its size */
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;text-align:right;padding:0}
.item .t{overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.76rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:.74rem;border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:6px;height:6px}
.pill.urgent{border-color:var(--urgent);color:var(--urgent);font-weight:600}
.group-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.group-h .sw{width:10px;height:10px;border-radius:3px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.cats-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cq{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.cq .dot{width:8px;height:8px}
/* events: a tag on items that keeps them in their own category */
.adddate{flex:none;border:0;background:transparent;min-height:40px;padding:0 4px;font-size:.95rem;font-weight:500;color:var(--accent)}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emogrid button{font-size:1.3rem;line-height:1;aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0}
.emogrid button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.evmark{font-size:.95rem;line-height:1}
.linklist{display:flex;flex-direction:column;max-height:50vh;overflow:auto;overscroll-behavior:contain}
.linklist label{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.linklist label:first-child{border-top:0}
.linklist input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.linklist .lt{flex:1;min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding-top:6px}

/* dock */
.entry{display:flex;gap:8px;align-items:flex-end}
.entry textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;max-height:120px;font-size:16px}
.addbtn{flex:1;height:48px;padding:0 18px;border:0;border-radius:8px;background:var(--primary);color:var(--primary-ink);font-weight:600;font-size:1.05rem}
.addbtn:disabled{opacity:.45}
.hint{font-size:.76rem;color:var(--muted)}
.preview{display:flex;flex-wrap:wrap;gap:6px}
.pv{border:1px solid var(--c);border-radius:10px;padding:4px 8px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:.82rem;max-width:100%}
.pv .dot{background:var(--c)}
.sg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.sg .dot{width:8px;height:8px;background:var(--c)}
.toast{display:flex;align-items:center;justify-content:center;gap:14px}
.toast .undo{border:0;background:transparent;color:var(--accent-soft);font-weight:700;text-decoration:underline;padding:2px 4px}
.pv b{font-weight:600;overflow-wrap:anywhere}
.pv select{border:0;background-color:var(--bg);font-size:.78rem;color:var(--muted);max-width:9em}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto;overscroll-behavior:contain}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0;width:100%;font-size:16px}
.gridclip{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:600;background:var(--primary);color:var(--primary-ink)}
.btn.sec{background:var(--sunken);color:var(--ink)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.toast{position:fixed;bottom:calc(var(--dock-h,76px) + 12px);inset-inline:16px;margin:0 auto;max-width:420px;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem;text-align:center}

/* categories editor */
.catrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px}
.catrow .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.catrow input[type=text],.catrow select,.catrow textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.catrow textarea{font-size:.82rem;min-height:56px}
@media (prefers-reduced-motion: no-preference){.day,.chk,nav.tabs button{transition:background .15s, box-shadow .15s, filter .1s}button{transition:opacity .1s, filter .1s}}
/* sign-in gate */
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h1{margin:0;font-size:1.6rem}
.gate p{margin:0;color:var(--muted)}
.gate .btn{padding:12px 16px;font-size:1rem}
/* mic */
.micbtn.on{background:var(--urgent);border-color:var(--urgent);color:var(--on-urgent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){.micbtn.on{animation:none}}
.talk{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;overscroll-behavior:contain}
.talk button{width:150px;height:150px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.1rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sync.off i{background:var(--urgent)}
.backup{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ===== the approved look (option A + night + centre mic) ===== */
header.top{height:52px;gap:10px;justify-content:flex-start}
.mark{flex:none;display:block}
.brand{font-family:var(--f-display);font-size:1.1rem;font-weight:600;line-height:1;margin:0}
.hbtn{position:relative;width:44px;height:44px;flex:none;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0;border-radius:8px}
.hbtn.sm{width:36px;height:36px}
.ndot{position:absolute;top:9px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--urgent)}
.linkbtn{border:0;background:transparent;padding:0;min-height:36px;color:var(--accent);font-weight:500;font-size:.95rem;display:inline-flex;align-items:center;gap:4px}
.phead{display:flex;align-items:flex-end;gap:12px;margin-top:2px}
.phead > div{flex:1;min-width:0}
.ptitle{font-family:var(--f-display);font-size:1.65rem;font-weight:600;line-height:1.3;margin:0}
.psub{margin:2px 0 0;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.sm{padding:0 12px;height:38px;font-size:.92rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.sec{border:1px solid var(--control);background:var(--surface)}
.card{padding:6px 14px}
.ch{margin:8px 0 2px;font-size:.88rem;font-weight:500;color:var(--muted)}
.dh{margin:12px 0 0;font-size:.95rem;font-weight:600}
.item{border-top-color:var(--rule);min-height:48px}
.item .t{font-size:1.05rem}
.chk.on{color:var(--surface)}
@supports (color: color-mix(in srgb, red 50%, white)){
  :root[data-theme="dark"] .chk, :root[data-theme="dark"] .sq, :root[data-theme="dark"] .sw, :root[data-theme="dark"] .cl i{filter:brightness(1.3)}

<script>
/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const todayStr = () => ymd(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtG = new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn", { day: "numeric", month: "short" });
const fmtMonth = new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn", { month: "long", year: "numeric" });
let fmtH; try { fmtH = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { fmtH = null; }
function toast(msg, undo) {
  const t = $("#toast"); t.hidden = false; t.innerHTML = `<span>${esc(msg)}</span>`;
  if (undo) { const b = document.createElement("button"); b.className = "undo"; b.textContent = "تراجع"; b.onclick = () => { t.hidden = true; undo(); }; t.appendChild(b); }
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, undo ? 5000 : 2200);
}

/* Arabic counts: 1 عنصر واحد · 2 عنصران · 3–10 عناصر · 11–99 عنصراً · 0/100+ عنصر */
const PR = (() => { try { return new Intl.PluralRules("ar"); } catch (e) { return null; } })();
const W_ITEM = ["عنصر", "عنصران", "عناصر", "عنصراً"], W_PIECE = ["صنف", "صنفان", "أصناف", "صنفاً"], W_REC = ["سجل", "سجلان", "سجلات", "سجلاً"];
function count(n, w) {
  const f = PR ? PR.select(n) : "other";
  return f === "one" ? w[0] + " واحد" : f === "two" ? w[1] : f === "few" ? n + " " + w[2] : f === "many" ? n + " " + w[3] : n + " " + w[0];
}
/* an inline error under a field, with focus on it */
function fieldError(sel, msg) {
  const inp = $(sel); if (!inp) return toast(msg);
  const f = inp.closest(".field"); let er = f && f.querySelector(".ferr");
  if (f && !er) { er = document.createElement("span"); er.className = "ferr"; er.id = inp.id + "-err"; er.setAttribute("role", "alert"); f.appendChild(er); }
  if (er) { er.textContent = msg; inp.setAttribute("aria-describedby", er.id); }
  inp.setAttribute("aria-invalid", "true");
  inp.addEventListener("input", () => { inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby"); if (er) er.remove(); }, { once: true });

/* ===================== Arabic parser (pure) ===================== */
//#PARSER-START
const AR_DIGITS = { "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9" };
function clean(s) { return String(s).replace(/[ً-ْـ]/g, "").replace(/[٠-٩]/g, d => AR_DIGITS[d]).replace(/\s+/g, " ").trim(); }
function norm(s) { return clean(s).replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase(); }
// pattern written in normalized form -> tolerant regex for original text
function fx(p) { return p.replace(/ا/g, "[اأإآ]").replace(/ه/g, "[هة]").replace(/ي/g, "[يى]"); }
const NUMW = { "واحد":1,"يومين":2,"اثنين":2,"ثلاث":3,"ثلاثه":3,"اربع":4,"اربعه":4,"خمس":5,"خمسه":5,"ست":6,"سته":6,"سبع":7,"سبعه":7,"ثمان":8,"ثمانيه":8,"تسع":9,"تسعه":9,"عشر":10,"عشره":10 };
const WEEKDAYS = ["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعه","السبت"];
const SHOP_VERBS = ["اشتري","اشتر","اشترِ","جيب","جيبوا","هات","نحتاج","محتاجين","ناقص","ناقصنا","خلص","خلصت","شراء","نشتري"];
const TASK_VERBS = ["نظف","تنظيف","رتب","ترتيب","اغسل","غسيل","غسل","اكوي","كوي","غير","تغيير","صلح","تصليح","اصلاح","اتصل","كلم","ادفع","دفع","سدد","سداد","فاتوره","موعد","احجز","حجز","راجع","مراجعه","جدد","تجديد","ودي","وصل","وصلي","ركب","تركيب","افحص","فحص","اسقي","سقي","ازرع","تذكير","ذكرني","اطبخ","جهز","تجهيز","شيل","نزل","ارسل","استلم"];

function tokenVariants(t) {
  const v = new Set([t]);
  for (const p of ["وال","بال","لل","فال","ال","و","ب","ل"]) if (t.startsWith(p) && t.length - p.length >= 2) v.add(t.slice(p.length));
  return [...v];
}
function kwHit(tokens, kw) {
  const k = norm(kw); if (!k) return false;
  if (k.includes(" ")) return tokens.join(" ").includes(k);
  return tokens.some(t => tokenVariants(t).some(v => v === k || (k.length >= 3 && v.startsWith(k) && v.length - k.length <= 2)));

function scoreCats(text, cats) {
  const tokens = norm(text).split(" ").filter(Boolean);
  let best = null, bestScore = 0;
  for (const c of cats) {
    let s = 0; for (const kw of c.kw || []) if (kwHit(tokens, kw)) s++;
    if (s > bestScore) { best = c; bestScore = s; }
  }
  return { cat: best, score: bestScore, tokens };
}

function parseWhen(text, now) {
  let t = clean(text); const n = norm(t); let date = null; let recur = null; let priority = "normal";
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const strip = re => { t = t.replace(new RegExp(re, "g"), " "); };
  // priority
  if (/(عاجل|مستعجل|ضروري|بسرعه|مهم جدا)/.test(n)) { priority = "urgent"; strip(fx("(عاجل|مستعجل|ضروري|بسرعه|مهم جدا)")); }
  // recurrence
  let m = n.match(/كل\s+(\d+|[^\s]+)?\s*(يوم|ايام|اسبوع|اسابيع|اسبوعين|شهر|شهور|اشهر|شهرين|سنه|سنين|سنوات)/);
  if (m) {
    let num = m[1] && /^\d+$/.test(m[1]) ? +m[1] : (m[1] && NUMW[m[1]]) || 1;
    let unit = m[2];
    if (unit === "اسبوعين" || unit === "شهرين") num = 2;
    unit = /يوم|ايام/.test(unit) ? "day" : /اسبوع|اسابيع/.test(unit) ? "week" : /شهر|شهور|اشهر/.test(unit) ? "month" : "year";
    if (m[1] && !/^\d+$/.test(m[1]) && !NUMW[m[1]]) num = 1;
    recur = { n: num, unit };
    strip(fx("كل\\s+(\\d+|[^\\s]+)?\\s*(يوم|ايام|اسبوع|اسابيع|اسبوعين|شهر|شهور|اشهر|شهرين|سنه|سنين|سنوات)"));

  const nn = norm(t);

    for (const o of list) { const live = !o.proj && !o.it.done; byCat.set(o.it.cat, (byCat.get(o.it.cat) || false) || live); }
    const dk = state.cats.map(c => c.id).concat("inbox").filter(c => byCat.has(c));
    const segs = dk.slice(0, 3).map(c => `<i class="${byCat.get(c) ? "" : "faint"}" style="background:${catById(c).color}"></i>`).join("") + (dk.length > 3 ? `<i class="more"></i>` : "");
    html += `<button class="day${d.getMonth() !== mo && !col ? " out" : ""}${k === t ? " today" : ""}${k === state.sel ? " sel" : ""}${list.length ? " has" : ""}" data-day="${k}"${k === t ? ' aria-current="date"' : ""} aria-pressed="${k === state.sel}" aria-label="${fmtG.format(d)}، ${list.length ? count(list.length, W_ITEM) : "لا عناصر"}">${col ? `<span class="dn">${fmtWd.format(d)}</span>` : ""}<span class="dd">${d.getDate()}</span>${segs ? `<span class="cl">${segs}</span>` : ""}</button>`;
  }
  $("#calGrid").innerHTML = html;

  /* the selected day */
  const { rows, projOf } = dayRows();
  const isToday = state.sel === t;
  const sup = rows.filter(r => r.it.cat === "super" && !r.it.done && !r.proj).map(r => r.it);
  const rest = sortItems(rows.filter(r => !(r.it.cat === "super" && !r.it.done && !r.proj)).map(r => r.it));
  const openN = sup.length + rest.filter(it => !it.done).length;
  const inboxN = isToday ? state.items.filter(it => it.cat === "inbox").length : 0;
  let out = `<div class="card"><h3 class="ch">${openN ? count(openN, W_ITEM) + (isToday ? " اليوم" : "") : isToday ? "لا شيء اليوم" : "لا شيء في هذا اليوم"}</h3><div class="list">`;
  if (sup.length) out += tripRow(sup.length, "home", "مشوار السوبرماركت");
  out += rest.map(it => itemRow(it, { proj: projOf.get(it), showDate: effDate(it) !== state.sel, showCat: kindOf(it) === "shop" })).join("");
  if (!openN && !rest.length) out += `<div class="empty" style="padding:10px 0">اضغط المايك بالأسفل وقل ما تريد، مثلاً «اتصل بالسباك بكرة». الضغط المطوّل يفتح الكتابة.</div>`;
  if (inboxN) out += `<button class="triprow row inboxrow" data-act="menuGo" data-to="inbox"><span class="t" style="flex:1">${inboxN === 1 ? "عنصر واحد" : count(inboxN, W_ITEM)} في الوارد بلا تصنيف</span><span class="tc">${inboxN === 1 ? "صنّفه" : inboxN === 2 ? "صنّفهما" : "صنّفها"}</span></button>`;
  out += `</div></div>`;

  /* the next six days */
  let up = "";
  for (let i = 1; i <= 6; i++) {
    const k = ymd(addDays(parseYmd(state.sel), i)), list = (occ[k] || []).filter(o => !o.it.done && o.it.cat !== "inbox");
    if (!list.length) continue;
    const s2 = list.filter(o => o.it.cat === "super" && !o.proj), r2 = sortItems(list.filter(o => !(o.it.cat === "super" && !o.proj)).map(o => o.it));
    const pj = new Map(list.map(o => [o.it, o.proj]));
    up += `<h4 class="dh">${fmtDay.format(parseYmd(k)).replace("،", "")}</h4><div class="list">${s2.length ? tripRow(s2.length, "shop", "مشوار السوبرماركت") : ""}${r2.map(it => itemRow(it, { proj: pj.get(it), showDate: false, showCat: true })).join("")}</div>`;
  }
  if (up) out += `<div class="card"><h3 class="ch">${isToday ? "القادم هذا الأسبوع" : "الأيام التالية"}</h3>${up}</div>`;
  $("#dayList").innerHTML = out;
}
/* the selected day's rows (plus overdue items when the selected day is today) */
function dayRows() {
  const t = todayStr();
  const selOcc = occurrences(state.sel, state.sel)[state.sel] || [];
  const extra = state.sel === t ? state.items.filter(it => it.cat !== "inbox" && !it.done && effDate(it) && effDate(it) < t) : [];
  const rows = [...extra.map(it => ({ it, proj: false })), ...selOcc];

/* Esc closes the innermost overlay */

/* long press on the supermarket's title in the shopping tab (or its row on the home screen) opens it full screen; a short tap keeps its usual action */

  let timer = null, sx = 0, sy = 0, el = null, fired = false;
  const target = e => { const h = e.target.closest && e.target.closest("[data-focus][data-cat]"); return h && FOCUS_CATS.includes(h.dataset.cat) ? h : null; };
  const stop = () => { clearTimeout(timer); timer = null; if (el) el.classList.remove("pressing"); el = null; };
  document.addEventListener("pointerdown", e => {
    const h = target(e); if (!h || e.button > 0) return;
    stop(); el = h; sx = e.clientX; sy = e.clientY; fired = false; h.classList.add("pressing");
    timer = setTimeout(() => {

  });
  document.addEventListener("pointermove", e => { if (el && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) stop(); });
  for (const t of ["pointerup", "pointercancel", "scroll"]) document.addEventListener(t, stop, true);
  // the click that ends a long press must not also open/close the group
  document.addEventListener("click", e => { if (fired) { fired = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);

function renderShop() {

const CFG = window.DAFTAR_CONFIG || {};
const FB = "https://www.gstatic.com/firebasejs/" + (CFG.sdkVersion || "13.1.0") + "/";

function gate(msg, btn, onBtn, showOut) {

(async () => {
  if (!CFG.firebase || !CFG.firebase.apiKey || String(CFG.firebase.apiKey).startsWith("ضع")) {
    gate("لم تُضبط إعدادات Firebase بعد. أكمل ملف config.js كما في دليل الإعداد."); return;
  }
  let app, A, S;
  try {
    const appMod = await import(FB + "firebase-app.js");
    A = await import(FB + "firebase-auth.js");
    S = await import(FB + "firebase-firestore.js");
    app = appMod.initializeApp(CFG.firebase);
  } catch (e) { gate("تعذّر تحميل التطبيق. تحقق من الاتصال ثم أعد فتح الصفحة."); return; }

  // App Check protects the AI quota from use outside this site (required by Firebase AI Logic)
  if (CFG.appCheckSiteKey) {
    try { const AC = await import(FB + "firebase-app-check.js"); AC.initializeAppCheck(app, { provider: new AC.ReCaptchaEnterpriseProvider(CFG.appCheckSiteKey), isTokenAutoRefreshEnabled: true }); } catch (e) {}
  }

  // Firestore with an on-device cache: opens instantly, works offline, syncs when back online
  let F;
  try { F = S.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: S.persistentLocalCache({ tabManager: S.persistentMultipleTabManager() }) }); }
  catch (e) { F = S.getFirestore(app); }

  // small adapter with the same shape the app already uses
  const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  const docApi = path => { const r = S.doc(F, path); return {
    set: d => S.setDoc(r, d), update: d => S.updateDoc(r, d), merge: d => S.setDoc(r, d, { merge: true }),
    delete: () => S.deleteDoc(r), onSnapshot: (n, e) => S.onSnapshot(r, s => n(snapDoc(s)), e) }; };
  const itemsCol = S.collection(F, "items");
  const openMap = new Map(), doneMap = new Map();
  let doneFrom = null, unsubDone = null, unsubs = [];
  const mergeItems = () => { const m = new Map(openMap); for (const [k, v] of doneMap) m.set(k, v); state.items = [...m.values()]; render(); };
  const onErr = e => { if (e && e.code === "permission-denied") deny(); };
  const api = {
    doc: docApi,
    collection: path => ({ doc: id => docApi(path + "/" + id) }),
    // bought/done items are loaded only from the earliest day on screen, so a year of history isn't read on every open
    ensureDoneFrom(ms) {
      if (doneFrom !== null && ms >= doneFrom) return;
      doneFrom = ms; if (unsubDone) unsubDone();
      unsubDone = S.onSnapshot(S.query(itemsCol, S.where("doneAt", ">=", ms)), snap => {
        doneMap.clear(); snap.forEach(d => { const v = d.data(); if (v.done) doneMap.set(d.id, { id: d.id, ...v }); }); mergeItems();
      }, onErr);
    },
    async oldDone(cutoff) { const q = await S.getDocs(S.query(itemsCol, S.where("doneAt", "<", cutoff))); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async all() { const q = await S.getDocs(itemsCol); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async importAll(data) {
      const writes = [];
      for (const it of data.items || []) { const { id, ...rest } = it; if (id) writes.push([S.doc(F, "items/" + id), { doneAt: null, ...rest }]); }
      if (Array.isArray(data.cats) && data.cats.length) writes.push([S.doc(F, "config/categories"), { list: data.cats }]);
      if (data.trips) writes.push([S.doc(F, "config/trips"), data.trips]);
      if (Array.isArray(data.events)) writes.push([S.doc(F, "config/events"), { list: data.events }]);
      if (data.history) writes.push([S.doc(F, "history/recent"), { items: data.history }]);
      for (let i = 0; i < writes.length; i += 400) { const b = S.writeBatch(F); for (const [r, v] of writes.slice(i, i + 400)) b.set(r, v); await b.commit(); }
      return writes.length;
    }
  };

  function stopData() { unsubs.forEach(u => u()); unsubs = []; if (unsubDone) unsubDone(); unsubDone = null; doneFrom = null; openMap.clear(); doneMap.clear(); db = null; }
  function deny() {
    const u = auth.currentUser; stopData();
    gate(`الحساب ${u ? u.email : ""} غير مصرّح له باستخدام هذا الدفتر. اطلب من صاحب الدفتر إضافته.`, null, null, true);
  }

  const auth = A.getAuth(app);
  const provider = new A.GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
  const signIn = async () => {
    try { await A.signInWithPopup(auth, provider); }
    catch (e) { if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) A.signInWithRedirect(auth, provider); else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("تعذّر تسجيل الدخول. حاول مرة أخرى"); }

    state.userEmail = user.email || "";
    gate("جارِ فتح الدفتر…");
    // the security rules decide who is family: a read that is refused means this account is not on the list
    try { await S.getDoc(S.doc(F, "config/categories")); }
    catch (e) { if (e && e.code === "permission-denied") return deny(); }
    db = api; gate(null); setSync("db");
    unsubs.push(S.onSnapshot(S.query(itemsCol, S.where("done", "==", false)), snap => {
      openMap.clear(); snap.forEach(d => openMap.set(d.id, { id: d.id, ...d.data() })); mergeItems(); state.openLoaded = true; migrateTrips();
    }, onErr));
    unsubs.push(docApi("history/recent").onSnapshot(snap => { const h = snap.exists && snap.data().items; state.history = h && typeof h === "object" ? { ...h } : {}; if (entry.value) renderPreview(); }, onErr));
    unsubs.push(docApi("config/events").onSnapshot(snap => { const l = snap.exists && snap.data().list; state.events = Array.isArray(l) ? l : []; render(); }, onErr));
    unsubs.push(docApi("config/trips").onSnapshot(snap => { state.trips = snap.exists ? { ...snap.data() } : {}; render(); migrateTrips(); }, onErr));
    unsubs.push(docApi("config/categories").onSnapshot(snap => { const l = snap.exists && snap.data().list; state.cats = Array.isArray(l) && l.length ? l : DEFAULT_CATS; if (state.tab !== "cats") catDraft = null; render(); }, onErr));
    api.ensureDoneFrom(addDays(new Date(), -40).getTime());
    render(); sweepBought();
    if (location.hash === "#voice") startVoiceFromLink();
  });
  addEventListener("online", () => setSync(state.mode)); addEventListener("offline", () => setSync(state.mode));

  // Gemini through Firebase AI Logic: classifies what the local keyword engine could not
  if (CFG.ai !== false) {
    try {
      const AI = await import(FB + "firebase-ai.js");
      const ai = AI.getAI(app, { backend: new AI.GoogleAIBackend() });

    } catch (e) { aiModel = null; }
  }
})();

async function aiClassify(it) {
  if (!aiModel || !it || !it.id) return;
  const list = state.cats.map(c => `- ${c.id}: ${c.name} (${c.kind === "shop" ? "مشتريات" : "مهام"}) — أمثلة: ${(c.kw || []).slice(0, 15).join("، ")}`).join("\n");
  const prompt = `أنت تصنّف عنصراً أدخله فرد من أسرة سعودية في تطبيق للمهام والمشتريات المنزلية. قد يكون بالعامية أو فيه خطأ إملائي من الإملاء الصوتي.
التصنيفات المتاحة:
${list}

العنصر: «${it.title}»

أعد JSON فقط بهذا الشكل: {"cat": "معرّف التصنيف من القائمة، أو inbox إن لم تكن متأكداً", "title": "اسم العنصر مختصراً ومصححاً إملائياً، دون أفعال مثل اشتري أو جيب أو نحتاج"}`;

    let txt = r.response.text().trim().replace(/^```(json)?/i, "").replace(/```$/, "");
    const j = JSON.parse(txt), c = state.cats.find(x => x.id === j.cat);
    if (!c) { toast("لم يتعرّف عليه التصنيف، فبقي في الوارد"); return; }
    const title = typeof j.title === "string" && j.title.trim() && j.title.length <= 80 ? j.title.trim() : it.title;
    const patch = { cat: c.id, title, aiCat: true };
    if (c.kind === "shop") { patch.pin = false; if (usesTrip(c.id)) { patch.date = null; await dropStaleTrip(c.id, it.id); } }
    store.update(it.id, patch);
    toast(`«${title}» ← ${c.name}`);
  } catch (e) { /* quota, network or App Check: the item simply stays in the inbox */ }
}

/* ===================== voice input (browser speech recognition) ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = "";
const micBtn = $("#micBtn");
if (!SR) { micBtn.setAttribute("aria-label", "أضف بالكتابة"); $("#micSw").hidden = true; }
function setMic(on) {
  document.body.classList.toggle("listening", on);
  micBtn.setAttribute("aria-label", on ? "إيقاف الاستماع" : "أضف بالصوت، أو اضغط مطوّلاً للكتابة");
  if (on) { $("#dockTitle").textContent = curEv() ? "أضف إلى " + evById(curEv()).emoji + " " + evById(curEv()).name : "أضف بالصوت"; }
  else render();
}
function listen() {
  if (!SR || state.readOnly) return false;
  if (rec) { rec.stop(); return true; }
  heard = ""; entry.value = ""; renderPreview();
  try {
    rec = new SR(); rec.lang = CFG.voiceLang || "ar-SA"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; entry.value = t; renderPreview(); if (e.results[e.results.length - 1].isFinal) heard = t; };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { openTalk(); toast("اسمح للمتصفح باستخدام الميكروفون، أو اضغط المايك مطوّلاً للكتابة"); }
      else if (e.error !== "no-speech" && e.error !== "aborted") toast("تعذّر الاستماع. اضغط المايك مطوّلاً للكتابة");
    };
    rec.onend = () => {
      rec = null; setMic(false);
      if (document.body.classList.contains("composing")) return;   // switched to typing: keep the text there
      if (heard.trim() && CFG.voiceAutoAdd !== false) submitEntry(); else { entry.value = ""; renderPreview(); }
    };
    rec.start(); setMic(true); return true;
  } catch (e) { rec = null; setMic(false); return false; }
}
/* the mic in the middle of the bar: a tap listens, a long press (~0.45s) opens typing */
(() => {
  let timer = null, fired = false, sx = 0, sy = 0;
  const stop = () => { clearTimeout(timer); timer = null; micBtn.classList.remove("pressing"); };
  micBtn.addEventListener("pointerdown", e => {
    if (e.button > 0) return; fired = false; sx = e.clientX; sy = e.clientY; micBtn.classList.add("pressing");
    timer = setTimeout(() => { stop(); fired = true; try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} openCompose(); }, 450);
  });
  micBtn.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) stop(); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) micBtn.addEventListener(t, stop);
  micBtn.addEventListener("contextmenu", e => e.preventDefault());
  micBtn.addEventListener("click", e => {
    if (fired) { fired = false; e.preventDefault(); return; }
    closeTalk();
    if (state.readOnly) return;
    if (!SR || !listen()) openCompose();
  });
})();
$("#talkBtn").onclick = () => { closeTalk(); listen(); };
$("#talk").addEventListener("click", e => { if (e.target.id === "talk") closeTalk(); });
/* the home-screen shortcut opens …/#voice: start listening right away, or show one big button where the browser needs a tap first */
function startVoiceFromLink() {
  history.replaceState(null, "", location.pathname + location.search);
  if (state.tab !== "home") goTab("home", 0, true);
  if (!SR) { openCompose(); return; }
  if (!listen()) openTalk();
}

/* ===================== backup / restore / account (categories tab) ===================== */
function backupCard() {
  return `<div class="card"><h2>الحساب والنسخ الاحتياطي</h2>
    <p class="small muted" style="margin:6px 0 0">${state.userEmail ? "مسجّل باسم " + esc(state.userEmail) : ""}</p>
    <div class="backup">
      <button class="btn sec" data-act="export">تنزيل نسخة احتياطية</button>
      <button class="btn sec" data-act="importPick" ${state.readOnly ? "disabled" : ""}>استيراد نسخة</button>
      <span class="spacer"></span>
      <button class="btn del" data-act="signout">تسجيل الخروج</button>
    </div>
    <div id="importConfirm" class="row" style="margin-top:10px" hidden></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>`;
}
let importData = null;
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "signout") window.daftarSignOut && window.daftarSignOut();
  if (act === "export" && db) {
    const data = { app: "daftar-albait", exportedAt: new Date().toISOString(), items: await db.all(), cats: state.cats, trips: state.trips, events: state.events, history: state.history };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = "daftar-albait-" + todayStr() + ".json"; document.body.appendChild(a); a.click(); a.remove();
  }
  if (act === "importPick") $("#importFile").click();
  if (act === "importGo" && importData && db) {
    $("#importConfirm").hidden = true;
    try { const n = await db.importAll(importData); toast("تم الاستيراد (" + count(n, W_REC) + ")"); }
    catch (err) { toast(err && err.code === "permission-denied" ? "ليس لديك صلاحية الاستيراد في هذا الدفتر" : "تعذّر الاستيراد. تحقق من الاتصال ثم أعد المحاولة"); }
    importData = null;
  }
  if (act === "importCancel") { importData = null; $("#importConfirm").hidden = true; }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  try {
    importData = JSON.parse(await e.target.files[0].text());
    const n = (importData.items || []).length, box = $("#importConfirm");
    box.innerHTML = `<span style="flex:1">استيراد ${count(n, W_ITEM)} مع التصنيفات والتواريخ والسجل؟ العناصر بنفس المعرّف ستُستبدل.</span><button class="btn sec" data-act="importCancel">إلغاء</button><button class="btn" data-act="importGo">استيراد</button>`;
    box.hidden = false;
  } catch (err) { toast("الملف غير صالح. اختر ملف نسخة احتياطية (‎.json) نزّلته من دفتر البيت"); }
  e.target.value = "";
});

</script>
